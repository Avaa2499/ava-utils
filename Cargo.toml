[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license-file = "LICENSE"

[workspace.dependencies]
ava-utils-config = { path = "crates/ava-utils-config" }
getrandom = "0.4"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
